name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    uses: remonenaidoo/swiftbets-platform/.github/workflows/dotnet.yml@main
    with:
      images: '[{"name": "swiftbets-cashout", "dockerfile": "deploy/SwiftBets.Cashout.Api.Dockerfile"}]'
      coverage: true
      coverage-floors: '{"SwiftBets.Cashout.Domain": {"branch": 80}, "SwiftBets.Cashout.Application": {"branch": 70}}'
    permissions:
      contents: read
      packages: write
      security-events: write
